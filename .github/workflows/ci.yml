name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.so }}

    # bash nos tres sistemas: no Windows o shell padrao e o PowerShell, e ele
    # desmonta "-Dexec.args=..." em dois argumentos antes de o Maven ver.
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Testes
        run: mvn -B -ntp verify

      - name: toda disciplina serve todo pacote, uma vez so
        run: mvn -B -ntp -q exec:java -Dexec.args="correcao"

      - name: a reparticao com todos os fluxos sempre cheios
        run: mvn -B -ntp -q exec:java -Dexec.args="saturado"

      - name: o atraso contra o compartilhamento ideal
        run: mvn -B -ntp -q exec:java -Dexec.args="ideal"

      - name: o quantum do rodizio com deficit
        run: mvn -B -ntp -q exec:java -Dexec.args="quantum"

      - name: o preco de decidir
        run: mvn -B -ntp -q exec:java -Dexec.args="preco"

      - name: Relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.so }}
          path: target/surefire-reports
